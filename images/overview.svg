  <text x="48" y="112" font-size="22" fill="#52627a">One algorithm. Different execution models.</text>
  <rect x="980" y="47" width="212" height="34" rx="17" fill="#ffffff" stroke="#dce4ee"/>
  <text x="1086" y="69" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#52627a">PYTHON + MLIR</text>
  <path d="M48 135H1192" stroke="#e2e8f0"/>
  <text x="48" y="169" class="label">01 / AUTHOR'S PROGRAM</text>
  <text x="370" y="169" class="label">02 / COMPILER</text>
  <text x="852" y="169" class="label">03 / TARGET LOWERING</text>
  <rect x="48" y="188" width="270" height="310" rx="16" fill="#ffffff" stroke="#dce4ee"/>
  <rect x="48" y="188" width="270" height="7" rx="3.5" fill="#3b82b6"/>
  <text x="72" y="232" class="heading">Explicit algorithms</text>
  <circle cx="79" cy="273" r="5" fill="#3b82b6"/>
  <text x="94" y="279" font-size="16" fill="#52627a">Domains + tensor values</text>
  <circle cx="79" cy="311" r="5" fill="#14968d"/>
  <text x="94" y="317" font-size="16" fill="#52627a">Logical access + state</text>
  <circle cx="79" cy="349" r="5" fill="#8671b0"/>
  <text x="94" y="355" font-size="16" fill="#52627a">Kernel + host calls</text>
  <path d="M72 382H294" stroke="#e8edf3"/>
  <rect x="72" y="403" width="222" height="70" rx="9" fill="#f1f5f9"/>
  <text x="88" y="429" class="mono" fill="#6c55a0">@intent.kernel</text>
  <text x="88" y="454" class="mono" fill="#334155">def algorithm(...):</text>
