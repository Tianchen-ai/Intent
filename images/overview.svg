<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" role="img" aria-labelledby="title description">
  <title id="title">IntentDSL: one algorithm, different execution models</title>
  <desc id="description">Authors describe an algorithm and explicit kernel composition. The MLIR compiler applies shared semantic analyses and execution-model passes, then lowers to Triton or cuTile for GPUs, Mojo or Weft for CPUs, and BANG C for MLUs. Generated source and IR are inspectable before native compilation, tuning, and Python calls.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#8997aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", Arial, sans-serif; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
      .heading { font-size: 21px; font-weight: 700; fill: #18263d; }
      .body { font-size: 17px; fill: #52627a; }
      .mono { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 16px; }
      .line { fill: none; stroke: #8997aa; stroke-width: 1.8; }
    </style>
  </defs>
  <rect x="1" y="1" width="1238" height="608" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
