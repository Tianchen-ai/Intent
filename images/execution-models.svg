<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title description">
  <title id="title">One region algorithm, three physical organizations</title>
  <desc id="description">An author-defined attention computation combines summaries across source regions. GPU programs own query tiles and carry their state. CPU tasks contain query blocks and local computation. A DSA work unit supplies source regions to local storage and reuses buffers after last use. Colors distinguish query data, source regions, state, and computation. This is a structural illustration, not a performance comparison.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#8997aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", Arial, sans-serif; }
      .heading { font-size: 20px; font-weight: 700; fill: #18263d; }
      .body { font-size: 16px; fill: #52627a; }
      .small { font-size: 14px; fill: #52627a; }
      .box { font-size: 15px; font-weight: 650; fill: #334155; text-anchor: middle; }
      .line { fill: none; stroke: #8997aa; stroke-width: 1.8; }
    </style>
  </defs>
  <rect x="1" y="1" width="1238" height="648" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="57" font-size="28" font-weight="700" fill="#18263d">Shared algorithm. Target-specific execution.</text>
  <text x="48" y="90" font-size="17" fill="#52627a">An attention region computation, realized through three different execution models.</text>

  <rect x="48" y="117" width="1144" height="81" rx="13" fill="#ffffff" stroke="#dce4ee"/>
  <text x="70" y="144" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748b">AUTHOR'S STRUCTURE</text>
  <rect x="70" y="155" width="125" height="27" rx="7" fill="#fff3dc"/>
  <text x="132.5" y="174" class="box">Initial state</text>
  <path d="M201 169H234" class="line" marker-end="url(#arrow)"/>
  <rect x="241" y="155" width="216" height="27" rx="7" fill="#eaf6f3"/>
  <text x="349" y="174" class="box">Compute source region</text>
  <path d="M463 169H496" class="line" marker-end="url(#arrow)"/>
  <rect x="503" y="155" width="204" height="27" rx="7" fill="#f2eef8"/>
  <text x="605" y="174" class="box">Combine summary</text>
  <path d="M713 169H746" class="line" marker-end="url(#arrow)"/>
  <rect x="753" y="155" width="137" height="27" rx="7" fill="#fff3dc"/>
  <text x="821.5" y="174" class="box">Updated state</text>
  <path d="M896 169H929" class="line" marker-end="url(#arrow)"/>
  <text x="949" y="174" font-size="15" font-weight="650" fill="#334155">Normalize output</text>
  <text x="505" y="143" font-size="12" fill="#64748b">Repeat across source regions</text>

  <rect x="48" y="226" width="360" height="329" rx="16" fill="#ffffff" stroke="#dce4ee"/>
  <rect x="48" y="226" width="360" height="6" rx="3" fill="#3b82b6"/>
  <text x="70" y="265" class="heading">GPU</text>
  <text x="70" y="291" class="body">Program owns a query tile</text>
  <rect x="70" y="312" width="316" height="191" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="86" y="330" width="134" height="39" rx="8" fill="#dcecf8"/>
  <text x="153" y="355" class="box">Query tile Q[I]</text>
  <rect x="239" y="330" width="131" height="39" rx="8" fill="#fff3dc"/>
  <text x="304.5" y="355" class="box">State S[I]</text>
  <path d="M153 373V390H295V406" class="line" marker-end="url(#arrow)"/>
  <rect x="86" y="412" width="105" height="43" rx="8" fill="#d9efea"/>
  <text x="138.5" y="439" class="box">Region Rj</text>
  <path d="M197 433H211" class="line" marker-end="url(#arrow)"/>
  <rect x="218" y="412" width="152" height="43" rx="8" fill="#e9e0f3"/>
  <text x="294" y="439" class="box">Tiled compute</text>
  <path d="M372 433H378V350H374" class="line" marker-end="url(#arrow)"/>
  <text x="86" y="483" class="small">State is carried across source regions.</text>
  <text x="70" y="533" class="small">Ownership + tensor-program execution</text>

  <rect x="440" y="226" width="360" height="329" rx="16" fill="#ffffff" stroke="#dce4ee"/>
  <rect x="440" y="226" width="360" height="6" rx="3" fill="#8671b0"/>
  <text x="462" y="265" class="heading">CPU</text>
  <text x="462" y="291" class="body">Tasks contain query blocks</text>
  <rect x="462" y="312" width="316" height="40" rx="9" fill="#dcecf8"/>
  <text x="620" y="337" class="box">Task t → query blocks I₀, I₁, …</text>
  <path d="M620 357V372" class="line" marker-end="url(#arrow)"/>
  <rect x="462" y="378" width="316" height="125" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="407" font-size="16" font-weight="650" fill="#334155">Query block Ic</text>
  <rect x="641" y="390" width="119" height="29" rx="7" fill="#fff3dc"/>
  <text x="700.5" y="410" class="box">State S[Ic]</text>
  <rect x="480" y="443" width="105" height="40" rx="8" fill="#d9efea"/>
  <text x="532.5" y="468" class="box">Region Rj</text>
  <path d="M591 463H619" class="line" marker-end="url(#arrow)"/>
  <rect x="626" y="443" width="134" height="40" rx="8" fill="#e9e0f3"/>
  <text x="693" y="468" class="box">Local compute</text>
  <path d="M762 463H770V404H764" class="line" marker-end="url(#arrow)"/>
  <text x="462" y="533" class="small">Task hierarchy + local implementation</text>

  <rect x="832" y="226" width="360" height="329" rx="16" fill="#ffffff" stroke="#dce4ee"/>
  <rect x="832" y="226" width="360" height="6" rx="3" fill="#14968d"/>
  <text x="854" y="265" class="heading">DSA / MLU</text>
  <text x="854" y="291" class="body">Work unit owns local storage</text>
  <g class="box">
    <rect x="854" y="312" width="57" height="36" rx="7" fill="#eaf6f3"/><text x="882.5" y="335">R₀</text>
    <rect x="919" y="312" width="57" height="36" rx="7" fill="#eaf6f3"/><text x="947.5" y="335">R₁</text>
    <rect x="984" y="312" width="57" height="36" rx="7" fill="#b9e2d9"/><text x="1012.5" y="335">Rj</text>
    <rect x="1049" y="312" width="57" height="36" rx="7" fill="#eaf6f3"/><text x="1077.5" y="335">Rj+1</text>
    <rect x="1114" y="312" width="57" height="36" rx="7" fill="#eaf6f3"/><text x="1142.5" y="335">…</text>
  </g>
  <rect x="854" y="378" width="316" height="125" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <path d="M1012.5 352V387" class="line" marker-end="url(#arrow)"/>
  <rect x="870" y="393" width="89" height="34" rx="7" fill="#dcecf8"/>
  <text x="914.5" y="415" class="box">Queries</text>
  <rect x="969" y="393" width="89" height="34" rx="7" fill="#d9efea"/>
  <text x="1013.5" y="415" class="box">Input</text>
  <rect x="1068" y="393" width="86" height="34" rx="7" fill="#fff3dc"/>
  <text x="1111" y="415" class="box">State</text>
  <path d="M914.5 431V451" class="line" marker-end="url(#arrow)"/>
  <path d="M1013.5 431V451" class="line" marker-end="url(#arrow)"/>
  <rect x="870" y="457" width="284" height="30" rx="8" fill="#e9e0f3"/>
  <text x="1012" y="478" class="box">Local tensor compute</text>
  <path d="M1111 453V433" class="line" marker-end="url(#arrow)"/>
  <text x="854" y="533" class="small">Supply regions + reuse after last use</text>

  <path d="M48 583H1192" stroke="#e2e8f0"/>
  <rect x="48" y="605" width="14" height="14" rx="3" fill="#dcecf8"/>
  <text x="72" y="618" class="small">Query data</text>
  <rect x="306" y="605" width="14" height="14" rx="3" fill="#d9efea"/>
  <text x="330" y="618" class="small">Source regions</text>
  <rect x="625" y="605" width="14" height="14" rx="3" fill="#fff3dc"/>
  <text x="649" y="618" class="small">State / summaries</text>
  <rect x="992" y="605" width="14" height="14" rx="3" fill="#e9e0f3"/>
  <text x="1016" y="618" class="small">Computation</text>
</svg>
