[build-system]
requires = []
build-backend = "pep517_backend"
backend-path = ["cmake"]

[project]
name = "intentdsl"
version = "2.1.0"
description = "Multi-target native JIT compiler for typed Python tensor kernels and programs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["compilerinfra==0.6.0"]

[project.scripts]
intentdsl = "intentdsl.cli:main"
intentdsl-compile = "intentdsl.cli:compile_main"
