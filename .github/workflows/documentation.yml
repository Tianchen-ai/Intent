name: Documentation

on:
  pull_request:
    paths:
      - 'doc/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'environment/docs.py'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'environment/docs.py'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: python environment/docs.py install
      - name: Build both languages
        run: python environment/docs.py build --site-dir "${RUNNER_TEMP}/intentdsl-site"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/intentdsl-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
