name: Distribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/distribution.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'lib/**'
      - 'tools/**'
      - 'python/**'
      - 'environment/**'
      - 'examples/**'
      - 'doc/**'
      - 'mcp/**'
      - 'images/**'
      - 'pyproject.toml'
      - 'README*.md'
      - 'CONTRIBUTING*.md'
      - 'LICENSE'
  pull_request:
    paths:
      - '.github/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'lib/**'
      - 'tools/**'
      - 'python/**'
      - 'environment/**'
      - 'examples/**'
      - 'doc/**'
      - 'mcp/**'
      - 'images/**'
      - 'pyproject.toml'
      - 'README*.md'
      - 'CONTRIBUTING*.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      publish-preview:
        description: Update the public preview downloads after building and checking the package
        type: boolean
        default: false
      publish-pypi:
        description: Publish to PyPI after configuring its Trusted Publisher for this workflow
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: manylinux_2_35 x86-64 / LLVM 20 / Python 3.10
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the proposed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the LLVM/MLIR 20 build SDK
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates curl gnupg
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$RUNNER_TEMP/intent-llvm-key.asc"
          gpg --batch --yes --dearmor --output "$RUNNER_TEMP/intent-llvm-key.gpg" \
            "$RUNNER_TEMP/intent-llvm-key.asc"
          sudo install --mode=0644 "$RUNNER_TEMP/intent-llvm-key.gpg" /usr/share/keyrings/intent-llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/intent-llvm.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main' \
            | sudo tee /etc/apt/sources.list.d/intent-llvm.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build gcc g++ python3.10-venv \
            llvm-20-dev libmlir-20-dev mlir-20-tools \
            libffi-dev libedit-dev libzstd-dev zlib1g-dev libxml2-dev

      - name: Build the sdist and wheel and inspect the installed product
        run: |
          /usr/bin/python3.10 environment/build.py \
            --output-dir "$RUNNER_TEMP/intent-distribution" \
            --work-dir "$RUNNER_TEMP/intent-distribution-work" \
            --mlir-dir /usr/lib/llvm-20/lib/cmake/mlir \
            --llvm-dir /usr/lib/llvm-20/lib/cmake/llvm \
            --jobs 2 \
            2>&1 | tee "$RUNNER_TEMP/intent-distribution.log"

      - name: Upload the installable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: intentdsl-ubuntu-22.04-x86_64
          path: |
            ${{ runner.temp }}/intent-distribution/*.whl
            ${{ runner.temp }}/intent-distribution/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build and installed-tool diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intentdsl-distribution-diagnostics
          path: |
            ${{ runner.temp }}/intent-distribution.log
            ${{ runner.temp }}/intent-distribution-work/commands/
            ${{ runner.temp }}/intent-distribution-work/*.json
            ${{ runner.temp }}/intent-distribution-work/cache/intentdsl/**/*.mlir
            ${{ runner.temp }}/intent-distribution-work/cache/intentdsl/**/*.json
            ${{ runner.temp }}/intent-distribution-work/cache/intentdsl/**/*.log
            ${{ runner.temp }}/intent-distribution-work/native-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

  preview:
    name: Publish the checked preview
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish-preview
    needs: distribution
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download this run's checked packages
        run: |
          gh run download "${{ github.run_id }}" \
            --name intentdsl-ubuntu-22.04-x86_64 \
            --dir "$RUNNER_TEMP/intent-preview"

      - name: Update the preview source and installable assets
        run: |
          gh release upload preview "$RUNNER_TEMP/intent-preview/"* --clobber
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/preview" \
            -f sha="$GITHUB_SHA" -F force=true
          gh release view preview --json assets --jq '.assets[].name' \
            > "$RUNNER_TEMP/intent-preview-assets.txt"
          while IFS= read -r asset; do
            if [[ ! -f "$RUNNER_TEMP/intent-preview/$asset" ]]; then
              gh release delete-asset preview "$asset" --yes
            fi
          done < "$RUNNER_TEMP/intent-preview-assets.txt"
          cat > "$RUNNER_TEMP/intent-preview-notes.md" <<'NOTES'
          Installable IntentDSL compiler package from the source at this preview tag.

          - [English handbook](https://tianchen-ai.github.io/Intent/en/) · [中文工具书](https://tianchen-ai.github.io/Intent/)
          - Linux x86-64, glibc 2.35 or newer; maintained backend environments use Python 3.10–3.12.
          - The wheel includes the compiler, optimizer and non-system compiler libraries. Installation does not require an LLVM/MLIR build SDK.
          - Download the wheel and install it with `python -m pip install "./intentdsl-…whl[manual,examples]"`, using its actual filename. Then run `intent setup --target triton` and `intent doctor --target triton`. Use a separate environment for cuTile.
          - The distribution workflow built the wheel from the source archive and checked metadata, native dependencies, isolated installation, compiler tools and MCP entry points. Hardware execution is separate from these build checks.
          - This preview is not a PyPI publication. The handbook covers source builds and CPU/MLU toolchains.

          本附件由同一份公开源码构建，包含编译器、优化器与所需的非系统编译库，安装无需 LLVM/MLIR SDK。下载 wheel 后使用 pip 安装，再选择 Triton 或 cuTile 后端；两者使用独立环境。构建流程检查源码包、平台依赖、隔离安装、编译工具和 MCP 入口；硬件运行与这些构建检查分别说明。当前使用公开附件或源码安装，尚未上传 PyPI。许可证为 Apache-2.0，第三方依赖保留自己的许可声明。
          NOTES
          gh release edit preview --title "IntentDSL preview" \
            --prerelease --draft=false --notes-file "$RUNNER_TEMP/intent-preview-notes.md"

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish-pypi
    needs: distribution
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download this run's checked packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "${{ github.run_id }}" \
            --name intentdsl-ubuntu-22.04-x86_64 --dir dist

      - name: Publish with the configured Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
